<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상식 퀴즈</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <!-- 화면: 시작(카테고리 선택) -->
  <section id="screen-start" class="screen">
    <h1>상식 퀴즈</h1>
    <p id="start-mode" class="mode-line"></p>
    <p id="start-note" class="note hidden"></p>
    <h2>카테고리를 고르세요</h2>
    <div class="button-column">
      <button type="button" class="choice" data-category-id="korean-history">한국사</button>
      <button type="button" class="choice" data-category-id="world-geography">세계지리</button>
      <button type="button" class="choice" data-category-id="science">과학</button>
      <button type="button" class="choice" data-category-id="arts-culture">예술과 문화</button>
    </div>
  </section>

  <!-- 화면: 퀴즈 -->
  <section id="screen-quiz" class="screen hidden">
    <p id="quiz-progress" class="progress"></p>
    <h2 id="quiz-text" class="question"></h2>
    <div id="choice-list" class="button-column"></div>
    <div id="feedback" class="feedback hidden">
      <p id="feedback-verdict" class="verdict"></p>
      <p id="feedback-explanation" class="explanation"></p>
      <p class="source">출처: <a id="feedback-source" href="#" target="_blank" rel="noopener noreferrer"></a></p>
    </div>
    <button id="btn-next" type="button" class="primary hidden">다음</button>
  </section>

  <!-- 화면: 결과 -->
  <section id="screen-result" class="screen hidden">
    <h2>결과</h2>
    <p id="result-score" class="score"></p>
    <p id="result-note" class="note hidden"></p>
    <ol id="result-list" class="result-list"></ol>
    <div class="button-column">
      <button id="btn-retry-category" type="button" class="primary">같은 카테고리 다시</button>
      <button id="btn-to-start" type="button">카테고리 선택으로</button>
    </div>
  </section>

</main>

<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
